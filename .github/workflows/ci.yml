name: CI

# Verification only. This workflow does NOT deploy - deploy.yml handles that,
# and it runs only on pushes to main. The point of this one is to catch a
# broken build, a type error or a failing test in a pull request *before* it
# reaches main, instead of after it has been published to GitHub Pages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sw.js
          test -f dist/budget/index.html
          test -f dist/manifest.webmanifest
          test -f dist/icons/icon-192.png
          # The service worker must have been stamped, not left as the
          # un-stamped template. post-build.mjs replaces this exact literal.
          grep -q 'const VERSION = "v1";' dist/sw.js \
            && { echo "::error::dist/sw.js was not stamped by post-build"; exit 1; }
          # 404.html must be a byte-for-byte copy of index.html.
          cmp -s dist/index.html dist/404.html \
            || { echo "::error::dist/404.html differs from dist/index.html"; exit 1; }
          echo "build output OK"
