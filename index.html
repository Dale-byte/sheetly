<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sheetly</title>
    <meta name="description" content="Sheetly budget app" />
    <meta name="theme-color" content="#3b82f6" />
    <link rel="manifest" href="/sheetly/manifest.webmanifest" />
    <link rel="icon" href="/sheetly/icons/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" href="/sheetly/icons/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/sheetly/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <script>
      // Refuse to be framed. GitHub Pages cannot send X-Frame-Options or
      // CSP frame-ancestors (those are response headers only, and _headers is
      // a Netlify/Cloudflare feature), so this is the only clickjacking
      // defence available here. The shell legitimately frames
      // /sheetly/budget/index.html, which is same-origin, so this does not
      // affect the app's own iframe.
      if (window.top !== window.self) {
        window.top.location = window.self.location;
      }
    </script>
    <meta name="apple-mobile-web-app-title" content="Sheetly" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
